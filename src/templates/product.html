<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta property="og:type" content="product">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/product.css">
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body>
  <header class="site-header">
    <a href="/catalogue/" class="wordmark">I&A Jewels</a>
  </header>
  <main class="product-page">
    <a class="back-link" href="/catalogue/" data-back-link>← Back to catalogue</a>
    <div class="product-layout">
      <section class="product-gallery" aria-label="Product images">
        {{GALLERY}}
      </section>
      <section class="product-info">
        <p class="eyebrow">{{CATEGORY_LABEL}}</p>
        <h1>{{NAME}}</h1>
        <p class="product-price">{{PRICE}}</p>
        {{VARIANTS}}
        {{DESCRIPTION}}
        <a class="button button--primary enquire-button" href="{{WHATSAPP_URL}}" data-whatsapp>Enquire / Order</a>
        <p class="helper-text">You can edit the message before sending it on WhatsApp.</p>
      </section>
    </div>
    {{MORE_IMAGES}}
    {{RELATED}}
  </main>
  <script type="module" src="/js/product.js"></script>
</body>
</html>
